<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion de Produits</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4"><div class="container"><span class="navbar-brand">Gestion de Produits</span></div></nav>
<div class="container">
  <form id="form" class="card card-body mb-4">
    <input type="hidden" id="id">
    <div class="row g-2">
      <div class="col-md-3"><input id="nom" class="form-control" placeholder="Nom" required></div>
      <div class="col-md-4"><input id="description" class="form-control" placeholder="Description"></div>
      <div class="col-md-2"><input id="prix" type="number" step="0.01" class="form-control" placeholder="Prix" required></div>
      <div class="col-md-2"><input id="categorie" class="form-control" placeholder="Catégorie"></div>
      <div class="col-md-1"><button class="btn btn-primary w-100">OK</button></div>
    </div>
  </form>
  <table class="table table-striped bg-white">
    <thead class="table-dark"><tr><th>Nom</th><th>Description</th><th>Prix</th><th>Catégorie</th><th>Actions</th></tr></thead>
    <tbody id="liste"></tbody>
  </table>
</div>
<script>
const API = "/api/produits";
let produits = [];
const $ = id => document.getElementById(id);

async function charger() {
  produits = await (await fetch(API)).json();
  $("liste").innerHTML = produits.map(p => `
    <tr><td><b>${p.nom}</b></td><td>${p.description || ""}</td>
    <td><span class="badge bg-success">${p.prix} DT</span></td><td>${p.categorie || ""}</td>
    <td><button class="btn btn-warning btn-sm" onclick="editer(${p.id})">Modifier</button>
        <button class="btn btn-danger btn-sm" onclick="supprimer(${p.id})">Supprimer</button></td></tr>`).join("");
}
function editer(id) {
  const p = produits.find(x => x.id === id);
  $("id").value = p.id; $("nom").value = p.nom; $("description").value = p.description || "";
  $("prix").value = p.prix; $("categorie").value = p.categorie || "";
}
async function supprimer(id) {
  if (confirm("Supprimer ce produit ?")) { await fetch(`${API}/${id}`, { method: "DELETE" }); charger(); }
}
$("form").onsubmit = async e => {
  e.preventDefault();
  const id = $("id").value;
  await fetch(id ? `${API}/${id}` : API, {
    method: id ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nom: $("nom").value, description: $("description").value,
                           prix: $("prix").value, categorie: $("categorie").value })
  });
  e.target.reset(); $("id").value = ""; charger();
};
charger();
</script>
</body>
</html>
